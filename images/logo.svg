<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Classic Corporate Blue Gradient -->
    <linearGradient id="corpBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Refined Academic Gold Accent Gradient -->
    <linearGradient id="academicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c07b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#a17a22" />
    </linearGradient>

    <!-- Platinum Silver Metallic Gradient -->
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Deep Navy Shield Background -->
    <linearGradient id="navyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Soft Professional Shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Ring (Academic Crest) -->
  <circle cx="120" cy="120" r="108" fill="url(#navyBgGrad)" stroke="url(#academicGold)" stroke-width="3" filter="url(#softShadow)" />
  <circle cx="120" cy="120" r="101" fill="none" stroke="url(#platinumGrad)" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8" />

  <!-- Inner Formal Emblem Shield -->
  <path d="M 120,34 
           C 152,34 182,44 182,64 
           C 182,122 156,172 120,196 
           C 84,172 58,122 58,64 
           C 58,44 88,34 120,34 Z" 
        fill="url(#corpBlueGrad)" 
        stroke="url(#academicGold)" 
        stroke-width="2.5" 
        opacity="0.95" />

  <!-- Three Academic / Excellence Stars -->
  <polygon points="120,44 122,50 128,50 123,54 125,60 120,56 115,60 117,54 112,50 118,50" fill="url(#academicGold)" />
  <polygon points="102,50 103.5,54.5 108,54.5 104.5,57.5 106,62 102,59 98,62 99.5,57.5 96,54.5 100.5,54.5" fill="url(#academicGold)" opacity="0.85" />
  <polygon points="138,50 139.5,54.5 144,54.5 140.5,57.5 142,62 138,59 134,62 135.5,57.5 132,54.5 136.5,54.5" fill="url(#academicGold)" opacity="0.85" />

  <!-- Refined Luxury Sedan Silhouette -->
  <!-- Roofline and Glasshouse -->
  <path d="M 78,118 
           C 86,102 100,90 122,88 
           C 142,86 156,92 164,102 
           C 168,107 172,113 176,118 
           C 166,117 156,116 150,110 
           C 144,102 134,98 122,98 
           C 106,98 94,104 88,118 Z" 
        fill="url(#academicGold)" />

  <path d="M 92,115 
           C 98,104 108,98 122,96 
           C 136,94 146,98 152,106 
           L 142,107 
           C 134,101 128,100 120,102 
           C 110,104 102,108 98,115 Z" 
        fill="#ffffff" 
        opacity="0.8" />

  <!-- Car Body Main Shoulder -->
  <path d="M 64,124 
           C 72,118 86,117 96,118 
           C 104,113 116,112 128,112 
           C 142,112 152,114 160,119 
           C 168,118 176,120 182,126 
           C 183,129 180,134 174,135 
           L 162,135 
           C 159,128 153,124 145,124 
           C 137,124 131,128 128,135 
           L 108,135 
           C 105,128 99,124 91,124 
           C 83,124 77,128 74,135 
           L 68,135 
           C 62,134 61,128 64,124 Z" 
        fill="url(#platinumGrad)" />

  <!-- Headlight & Taillight Accents -->
  <path d="M 178,124 L 184,126 L 180,129 Z" fill="#e2e8f0" />
  <path d="M 66,124 L 62,126 L 64,129 Z" fill="#f87171" />

  <!-- Wheels (Alloy Wheels & Hubs) -->
  <circle cx="145" cy="135" r="10.5" fill="#0f172a" stroke="url(#platinumGrad)" stroke-width="2" />
  <circle cx="145" cy="135" r="4.5" fill="url(#academicGold)" />

  <circle cx="91" cy="135" r="10.5" fill="#0f172a" stroke="url(#platinumGrad)" stroke-width="2" />
  <circle cx="91" cy="135" r="4.5" fill="url(#academicGold)" />

  <!-- Ground Line Accent -->
  <line x1="60" y1="148" x2="180" y2="148" stroke="url(#academicGold)" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

  <!-- Clean Corporate Ribbon & Typography -->
  <rect x="52" y="162" width="136" height="24" rx="4" fill="#0b1329" stroke="url(#academicGold)" stroke-width="1.2" />
  <text x="120" y="178" 
        font-family="'Cairo', 'Tajawal', sans-serif" 
        font-size="11" 
        font-weight="700" 
        letter-spacing="1.5" 
        fill="#f8fafc" 
        text-anchor="middle">مكتب تأجير السيارات</text>

  <!-- Subtitle -->
  <text x="120" y="218" 
        font-family="'Cairo', sans-serif" 
        font-size="10" 
        font-weight="600" 
        letter-spacing="3" 
        fill="#94a3b8" 
        text-anchor="middle">CAR RENTAL SVU</text>
</svg>
