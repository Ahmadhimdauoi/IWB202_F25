<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <defs>
    <!-- Dynamic Crimson Red Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Platinum Chrome Metallic Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Futuristic Hex Shield Gradient -->
    <linearGradient id="hexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182032" />
      <stop offset="50%" stop-color="#0f1626" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Ambient Neon Glow -->
    <radialGradient id="neonPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="hyperGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Neon Backlight -->
  <circle cx="130" cy="130" r="115" fill="url(#neonPulse)" />

  <!-- Outer Aerodynamic Geometric Emblem (Hexagonal Shield) -->
  <polygon points="130,16 232,58 232,176 130,242 28,176 28,58"
           fill="url(#hexBg)" 
           stroke="url(#crimsonGrad)" 
           stroke-width="4"
           stroke-linejoin="round" />

  <!-- Inner Cyan Tech Accent Border -->
  <polygon points="130,28 220,65 220,169 130,228 40,169 40,65"
           fill="none" 
           stroke="url(#cyanGrad)" 
           stroke-width="1.8" 
           stroke-dasharray="6,4" 
           opacity="0.8" />

  <!-- Speed Wings / Lateral Vents -->
  <path d="M 45,95 L 85,95 L 75,108 L 38,108 Z" fill="url(#crimsonGrad)" opacity="0.85" />
  <path d="M 215,95 L 175,95 L 185,108 L 222,108 Z" fill="url(#crimsonGrad)" opacity="0.85" />

  <path d="M 52,118 L 82,118 L 74,129 L 46,129 Z" fill="url(#cyanGrad)" opacity="0.75" />
  <path d="M 208,118 L 178,118 L 186,129 L 214,129 Z" fill="url(#cyanGrad)" opacity="0.75" />

  <!-- Aerodynamic Sports Car Profile / Silhouette -->
  <!-- Roofline and Windshield -->
  <path d="M 68,144 
           C 78,126 95,108 126,104 
           C 152,100 174,106 186,120 
           C 192,127 197,135 204,142 
           C 192,141 182,141 176,134 
           C 168,124 154,118 132,118 
           C 108,118 94,126 84,144 Z" 
        fill="url(#metalGrad)" />

  <!-- Glass Cockpit / Windshield Tint -->
  <path d="M 88,140 
           C 96,126 108,118 128,116 
           C 148,114 162,120 172,132 
           L 156,133 
           C 146,124 136,122 122,124 
           C 106,126 98,132 94,140 Z" 
        fill="url(#cyanGrad)" 
        opacity="0.9" />

  <!-- Car Main Shoulder Line & Body -->
  <path d="M 44,152 
           C 54,145 74,144 88,145 
           C 98,138 112,136 135,136 
           C 158,136 172,139 184,146 
           C 198,145 210,147 218,154 
           C 220,158 216,164 208,165 
           L 188,165 
           C 184,156 176,151 166,151 
           C 156,151 148,157 145,165 
           L 115,165 
           C 112,157 104,151 94,151 
           C 84,151 76,156 72,165 
           L 50,165 
           C 42,164 40,158 44,152 Z" 
        fill="url(#crimsonGrad)" 
        filter="url(#hyperGlow)" />

  <!-- Front LED Laser Headlight (Left in Arabic / Right physically) -->
  <polygon points="202,151 216,154 210,158 198,154" fill="#38bdf8" filter="url(#hyperGlow)" />
  <line x1="216" y1="154" x2="236" y2="158" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Rear LED Laser Taillight -->
  <polygon points="46,152 56,150 54,156 44,155" fill="#ff4d6d" filter="url(#hyperGlow)" />
  <line x1="44" y1="155" x2="24" y2="158" stroke="#ff4d6d" stroke-width="2.5" stroke-linecap="round" />

  <!-- Front Wheel (Alloy Rim & Glowing Caliper) -->
  <circle cx="166" cy="165" r="14" fill="#0b0f19" stroke="url(#metalGrad)" stroke-width="2.5" />
  <circle cx="166" cy="165" r="7" fill="url(#cyanGrad)" />

  <!-- Rear Wheel (Alloy Rim & Glowing Caliper) -->
  <circle cx="94" cy="165" r="14" fill="#0b0f19" stroke="url(#metalGrad)" stroke-width="2.5" />
  <circle cx="94" cy="165" r="7" fill="url(#crimsonGrad)" />

  <!-- Speed Ground Glow Streak -->
  <ellipse cx="130" cy="184" rx="85" ry="4" fill="url(#crimsonGrad)" opacity="0.6" filter="url(#hyperGlow)" />

  <!-- Monogram / Typography Text -->
  <text x="130" y="208" 
        font-family="'Cairo', sans-serif" 
        font-size="13" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#ffffff" 
        text-anchor="middle">CAR RENTAL</text>

  <!-- Star Emblems -->
  <polygon points="130,68 132,74 138,74 133,78 135,84 130,80 125,84 127,78 122,74 128,74" fill="url(#metalGrad)" />
</svg>
