<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Chrome / Platinum Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Deep Blue Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Radial Glow Behind Shield -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="105" fill="url(#glowGrad)" />

  <!-- Outer Shield Emblem -->
  <path d="M 120,18 
           C 165,18 206,32 206,58 
           C 206,128 172,192 120,222 
           C 68,192 34,128 34,58 
           C 34,32 75,18 120,18 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="4.5" 
        filter="url(#badgeShadow)" />

  <!-- Inner Inset Shield Border -->
  <path d="M 120,28 
           C 158,28 194,40 194,62 
           C 194,122 164,178 120,206 
           C 76,178 46,122 46,62 
           C 46,40 82,28 120,28 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.5" 
        stroke-opacity="0.6" 
        stroke-dasharray="6,4" />

  <!-- Top Crown / 3 Stars -->
  <g transform="translate(120, 52) scale(0.9)" text-anchor="middle">
    <!-- Center Star -->
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#goldGrad)" />
    <!-- Left Star -->
    <polygon points="-24,-7 -21,-1 -15,-1 -20,3 -18,9 -24,6 -30,9 -28,3 -33,-1 -27,-1" fill="url(#goldGrad)" />
    <!-- Right Star -->
    <polygon points="24,-7 27,-1 33,-1 28,3 30,9 24,6 18,9 20,3 15,-1 21,-1" fill="url(#goldGrad)" />
  </g>

  <!-- Stylized Luxury Sports Car Silhouette -->
  <g transform="translate(120, 122) scale(1.05)">
    <!-- Aerodynamic Speed Swoosh / Ground Line -->
    <path d="M -72,32 C -30,36 30,36 72,32 C 60,38 -60,38 -72,32 Z" fill="url(#goldGrad)" />
    
    <!-- Car Roof, Windshield & Fastback Contour -->
    <path d="M -62,18 
             C -52,14 -38,5 -18,2 
             C 8,-1 30,3 44,14 
             C 54,16 64,18 70,22
             C 62,24 45,24 38,20
             C 24,10 4,7 -14,9
             C -32,11 -46,18 -58,22
             Z" 
          fill="url(#goldGrad)" />

    <!-- Cabin Glass / Cockpit Highlight -->
    <path d="M -30,12 
             C -16,6 6,5 24,11 
             C 14,14 -4,15 -18,15 
             C -24,15 -28,14 -30,12 Z" 
          fill="#38bdf8" 
          opacity="0.85" />

    <!-- Headlight Laser Beam Glow -->
    <path d="M 64,21 L 76,23 L 64,24 Z" fill="#60a5fa" />
    <path d="M -56,21 L -66,22 L -56,23 Z" fill="#f87171" />

    <!-- Left Wheel Well & Alloy Rim -->
    <circle cx="-38" cy="24" r="10" fill="#0b0f19" stroke="url(#goldGrad)" stroke-width="2.2" />
    <circle cx="-38" cy="24" r="5" fill="url(#goldGrad)" />
    <!-- Wheel Spokes -->
    <line x1="-38" y1="15" x2="-38" y2="33" stroke="url(#goldGrad)" stroke-width="1.2" />
    <line x1="-47" y1="24" x2="-29" y2="24" stroke="url(#goldGrad)" stroke-width="1.2" />

    <!-- Right Wheel Well & Alloy Rim -->
    <circle cx="38" cy="24" r="10" fill="#0b0f19" stroke="url(#goldGrad)" stroke-width="2.2" />
    <circle cx="38" cy="24" r="5" fill="url(#goldGrad)" />
    <!-- Wheel Spokes -->
    <line x1="38" y1="15" x2="38" y2="33" stroke="url(#goldGrad)" stroke-width="1.2" />
    <line x1="29" y1="24" x2="47" y2="24" stroke="url(#goldGrad)" stroke-width="1.2" />
  </g>

  <!-- Brand Typography "ELITE" Ribbon inside Shield -->
  <g transform="translate(120, 185)">
    <rect x="-42" y="-12" width="84" height="19" rx="4" fill="#0b1120" stroke="url(#goldGrad)" stroke-width="1.2" />
    <text x="0" y="2" 
          font-family="'Cairo', 'Segoe UI', Arial, sans-serif" 
          font-weight="900" 
          font-size="11" 
          letter-spacing="4" 
          fill="url(#goldGrad)" 
          text-anchor="middle">ELITE</text>
  </g>
</svg>
